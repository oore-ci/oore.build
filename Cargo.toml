[workspace]
members = [
  "crates/oore",
  "crates/oore-cli-ui",
  "crates/oore-contract",
  "crates/oore-google-play",
  "crates/oore-runner",
  "crates/oored",
]
resolver = "2"

[workspace.package]
version = "0.1.48"
edition = "2024"
license = "MIT"
repository = "https://github.com/oore-ci/oore.build"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
redundant_clone = "warn"
undocumented_unsafe_blocks = "deny"

[workspace.dependencies]
anyhow = "1.0"
async-stream = "0.3"
casbin = "2"
axum = "0.8"
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "5"
hex = "0.4"
humantime = "2.1"
rand = "0.8"
security-framework = "3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "signal", "time"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
openidconnect = "4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tower-http = { version = "0.6", features = ["cors"] }
semver = "1"
flate2 = "1"
tar = "0.4"
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
cliclack = "=0.5.5"
console = "0.16"
urlencoding = "2"
jsonwebtoken = { version = "10", features = ["aws_lc_rs"] }
ring = "0.17"
base64 = "0.22"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite"] }
zeroize = { version = "1", features = ["derive"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["behavior-version-latest", "sigv4a", "rt-tokio", "default-https-client"] }

# Observability: OpenTelemetry + Prometheus
opentelemetry = "0.32"
opentelemetry_sdk = "0.32"
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["grpc-tonic", "trace", "tls-aws-lc", "tls-roots"] }
tracing-opentelemetry = "0.33"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false }

# OpenAPI documentation
utoipa = { version = "5", features = ["axum_extras"] }
ipnet = "2.10"
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }
libc = "0.2"

# Keep useful file and line information without storing full debugger metadata.
# Full debug information made routine local builds grow by several gigabytes.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"
