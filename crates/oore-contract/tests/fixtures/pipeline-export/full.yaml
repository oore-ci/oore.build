# Generated by Oore from the pipeline's settings. It runs the same commands in
# the same order.
# Commit it as .oore.yaml at the repository root, or at the pipeline's config
# path. Builds then read it from the repository instead of the pipeline's
# Build settings.
version: 2

app:
  # A .fvmrc file still takes precedence.
  flutter: '3.24.5'

targets:
  android:
    # Oore's default Android build command with the pipeline's Android build
    # arguments.
    # The pipeline uploads to Google Play, so the App Bundle Play needs is
    # built after the APK, as the pipeline's default Android build did.
    build: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols && flutter build appbundle --release --obfuscate --split-debug-info=build/symbols
    publish:
      # From the pipeline's Google Play settings, which still supply the
      # service account and release notes.
      play:
        track: production
        rollout: 0.05
        draft: false
  ios:
    # The pipeline's iOS build command.
    build: flutter build ipa --release --export-options-plist=ios/ExportOptions.plist
    publish:
      # From the pipeline's App Store Connect settings, which still supply the
      # API key and release notes.
      testflight:
        group: QA

steps:
  # Oore runs `flutter pub get` before the pipeline's own commands.
  - name: Get packages
    run: flutter pub get
  - name: dart run build_runner build --delete-conflicting-outputs
    run: dart run build_runner build --delete-conflicting-outputs
  # The target builds run here.
  - build
  # From the pipeline's Build commands, which ran after the platform builds.
  # Version 2 builds only through targets, so they run as steps right after
  # them.
  - name: ./scripts/upload-symbols.sh
    run: ./scripts/upload-symbols.sh
  - name: Run tests
    run: flutter test
  - name: echo "done"
    run: echo "done"

# Copied from the pipeline's environment variables. Anyone who can read the
# repository can read these values: keep sensitive ones in secrets and
# reference them as ${{ secrets.NAME }}.
env:
  API_URL: https://staging.example.com
  SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
  VERBOSE: 'yes'

# From the pipeline's trigger settings. `on` replaces them for push, pull
# request and tag webhooks; schedules and manual builds still come from the
# pipeline.
on:
  push:
    branches:
      - main
      - release/*
  tag:
    - v*
  paths:
    - lib/**
    - pubspec.yaml

build_number_offset: 4000
runs_on: [arm64, xcode-16]
isolation: vm
