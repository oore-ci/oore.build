# Generated by Oore from the pipeline's settings. It runs the same commands in
# the same order.
# Commit it as .oore.yaml at the repository root, or at the pipeline's config
# path. Builds then read it from the repository instead of the pipeline's
# Build settings.
# Some settings cannot be expressed exactly; see the WARNING comments below.
version: 2

# No Flutter version is pinned: a .fvmrc file, else the runner's Flutter,
# decides. Set app.flutter to pin one.

targets:
  ios:
    # Oore's default iOS build command.
    build: flutter build ios --release --no-codesign
    # WARNING: The pipeline collects no artifacts; version 2 collects the
    # platform defaults.
  macos:
    # Oore's default macOS build command.
    build: flutter build macos --release

steps:
  # Oore runs `flutter pub get` before the pipeline's own commands.
  - name: Get packages
    run: flutter pub get
  # The target builds run here.
  - build
  - name: flutter build web
    run: flutter build web
