# Generated by `oore pipeline migrate` from a version 1 .oore.yaml.
# It runs the same commands in the same order. Review it before committing:
# steps have new names, which logs and checks show, and comments from the old
# file are not carried over.
version: 2

app:
  # A .fvmrc file still takes precedence, as it did over flutter_version.
  flutter: '3.24.5'

targets:
  android:
    # Version 1's default Android build command with
    # platform_build_args.android.
    # When the pipeline's Google Play publishing was on, version 1 also built
    # an App Bundle after this command. Version 2 runs only `build`, so if
    # this pipeline uploads to Google Play, use:
    #    build: flutter build apk --release --split-per-abi --build-number=$OORE_VERSION_CODE && flutter build appbundle --release --build-number=$OORE_VERSION_CODE
    build: flutter build apk --release --split-per-abi --build-number=$OORE_VERSION_CODE
    # Version 1 collected one artifact list for the whole build. Every target
    # uses it, and each pattern is kept once.
    artifacts: &artifacts
      - build/app/outputs/flutter-apk/*.apk
      - build/ios/ipa/*.ipa
  ios:
    # Version 1's default iOS build command.
    build: flutter build ios --release --no-codesign
    artifacts: *artifacts

steps:
  # Version 1 ran `flutter pub get` before the pre_build commands whenever it
  # used the default platform build commands.
  - name: Get packages
    run: flutter pub get
  - name: Get packages (2)
    run: flutter pub get
  # The target builds run here.
  - build
  - name: echo "Build complete"
    run: echo "Build complete"

env:
  BUILD_FLAVOR: staging
  SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

build_number_offset: 4000
runs_on: [macos, xcode-16]
isolation: vm
