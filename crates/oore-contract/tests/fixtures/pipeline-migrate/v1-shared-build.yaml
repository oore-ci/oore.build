# Generated by `oore pipeline migrate` from a version 1 .oore.yaml.
# It runs the same commands in the same order. Review it before committing:
# steps have new names, which logs and checks show, and comments from the old
# file are not carried over.
# Some version 1 behaviour cannot be expressed exactly; see the WARNING
# comments below.
version: 2

# No Flutter version is pinned, as before: a .fvmrc file, else the runner's
# Flutter, decides. Set app.flutter to pin one.

targets:
  android:
    # From commands.build, which version 1 ran once in place of the platform
    # build commands.
    # WARNING: commands.build has 2 commands, which version 1 ran as separate
    # steps. Version 2 runs them as one step, `Build Android`, each in its own
    # subshell; a plain `flutter test` or `dart test` among them no longer
    # reports test results on its own.
    build: |-
      ( flutter build appbundle --release ) &&
      ( flutter build apk --release )

steps:
  - name: dart run build_runner build
    run: dart run build_runner build
  # The target builds run here.
  - build
  - name: echo done
    run: echo done
