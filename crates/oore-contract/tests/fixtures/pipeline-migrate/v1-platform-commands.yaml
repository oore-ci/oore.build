# Generated by `oore pipeline migrate` from a version 1 .oore.yaml.
# It runs the same commands in the same order. Review it before committing:
# steps have new names, which logs and checks show, and comments from the old
# file are not carried over.
version: 2

# No Flutter version is pinned, as before: a .fvmrc file, else the runner's
# Flutter, decides. Set app.flutter to pin one.

targets:
  ios:
    # From platform_commands.ios.
    # platform_build_args.ios is dropped: version 1 ignored it because
    # platform_commands.ios replaces the default command.
    build: flutter build ipa --release --export-method ad-hoc
    # Version 1 collected one artifact list for the whole build. Every target
    # uses it, and each pattern is kept once.
    artifacts: &artifacts
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/bundle/**/*.aab
      - build/ios/ipa/*.ipa
      - build/macos/Build/Products/Release/*.app
  android:
    # Version 1's default Android build command with
    # platform_build_args.android.
    # When the pipeline's Google Play publishing was on, version 1 also built
    # an App Bundle after this command. Version 2 runs only `build`, so if
    # this pipeline uploads to Google Play, use:
    #    build: flutter build apk --release --flavor prod && flutter build appbundle --release --flavor prod
    build: flutter build apk --release --flavor prod
    artifacts: *artifacts
  macos:
    # Version 1's default macOS build command with platform_build_args.macos.
    build: flutter build macos --release --dart-define=CHANNEL=beta
    artifacts: *artifacts

steps:
  # Version 1 ran `flutter pub get` before the pre_build commands whenever it
  # used the default platform build commands.
  - name: Get packages
    run: flutter pub get
  # The target builds run here.
  - build
