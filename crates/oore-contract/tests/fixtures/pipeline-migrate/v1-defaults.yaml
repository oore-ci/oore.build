# Generated by `oore pipeline migrate` from a version 1 .oore.yaml.
# It runs the same commands in the same order. Review it before committing:
# steps have new names, which logs and checks show, and comments from the old
# file are not carried over.
version: 2

# No Flutter version is pinned, as before: a .fvmrc file, else the runner's
# Flutter, decides. Set app.flutter to pin one.

targets:
  android:
    # Version 1's default Android build command.
    # When the pipeline's Google Play publishing was on, version 1 also built
    # an App Bundle after this command. Version 2 runs only `build`, so if
    # this pipeline uploads to Google Play, use:
    #    build: flutter build apk --release && flutter build appbundle --release
    build: flutter build apk --release
  ios:
    # Version 1's default iOS build command.
    build: flutter build ios --release --no-codesign

steps:
  # Version 1 ran `flutter pub get` before the pre_build commands whenever it
  # used the default platform build commands.
  - name: Get packages
    run: flutter pub get
  # The target builds run here.
  - build
