    <script>
      try {
        const savedTheme = localStorage.getItem('theme')
        const dark =
          savedTheme === 'dark' ||
          (savedTheme !== 'light' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.add(dark ? 'dark' : 'light')
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        document.querySelector('[data-theme="light"]').media = dark
          ? 'not all'
          : 'all'
        document.querySelector('[data-theme="dark"]').media = dark
          ? 'all'
          : 'not all'
      } catch {
        // The system color-scheme media query below remains the fallback.
      }
    </script>
    <script>
      // A page opened before a deploy can ask for script and style files the
      // deploy removed. The host answers those with this page, so the app never
      // starts and the loader would stay up. Reload once to pick up the new
      // files, and say what happened if that does not help.
      window.ooreRecoverFromLoadFailure = function (error) {
        console.error('Oore could not load', error)
        var key = 'oore_load_failure_reload_at'
        var now = Date.now()
        var last = 0
        try {
          last = Number(sessionStorage.getItem(key)) || 0
          if (now - last > 10000) {
            sessionStorage.setItem(key, String(now))
            window.location.reload()
            return true
          }
        } catch {
          // Without session storage a reload could loop, so show the message.
        }
        var loading = document.getElementById('app-loading')
        if (loading && !loading.querySelector('.app-loading__failure')) {
          loading.classList.add('app-loading--failed')
          var failure = document.createElement('div')
          failure.className = 'app-loading__failure'
          failure.setAttribute('role', 'alert')
          var message = document.createElement('p')
          message.textContent =
            'Oore could not load. Reload the page to try again.'
          var button = document.createElement('button')
          button.type = 'button'
          button.textContent = 'Reload'
          button.addEventListener('click', function () {
            window.location.reload()
          })
          failure.append(message, button)
          loading.removeAttribute('aria-hidden')
          loading.append(failure)
        }
        return false
      }
      window.addEventListener(
        'error',
        function (event) {
          var target = event.target
          if (
            target instanceof HTMLScriptElement ||
            (target instanceof HTMLLinkElement &&
              /(^|\s)(stylesheet|modulepreload)(\s|$)/.test(target.rel))
          ) {
            window.ooreRecoverFromLoadFailure(
              new Error('Failed to load ' + (target.src || target.href)),
            )
          }
        },
        true,
      )
    </script>

    <!-- Inline critical styles for instant first paint before CSS loads -->
    <style>
      html {
        --initial-background: #ffffff;
        --initial-brand: #bb4d00;
        background: var(--initial-background);
        color-scheme: light;
      }
      html.dark {
        --initial-background: #171717;
        color-scheme: dark;
      }
      html,
      body,
      #app {
        min-height: 100%;
        min-height: 100svh;
        background: var(--initial-background);
      }
      body {
        margin: 0;
      }
      @media (prefers-color-scheme: dark) {
        html:not(.light) {
          --initial-background: #171717;
          color-scheme: dark;
        }
      }
      .app-loading {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        background: var(--initial-background);
        opacity: 1;
        pointer-events: none;
      }
      .app-loading__stage {
        position: relative;
        display: grid;
        width: 80px;
        height: 80px;
        place-items: center;
      }
      .app-loading__halo {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgb(187 77 0 / 0.2) 0%,
          rgb(187 77 0 / 0.08) 38%,
          transparent 72%
        );
        opacity: 0;
        transform: scale(0.35);
        animation: app-loading-halo 480ms cubic-bezier(0.22, 1, 0.36, 1) 90ms
          both;
        pointer-events: none;
        will-change: transform, opacity;
      }
      .app-loading__mark {
        position: relative;
        width: 64px;
        height: 64px;
        color: var(--initial-brand);
        overflow: visible;
        animation: app-loading-mark 620ms linear both;
        will-change: transform, opacity;
      }
      .app-loading__source,
      .app-loading__source-pulse,
      .app-loading__artifact,
      .app-loading__artifact-slot {
        transform-box: fill-box;
        transform-origin: center;
        will-change: transform, opacity;
      }
      .app-loading__source {
        animation: app-loading-source 260ms cubic-bezier(0.16, 1, 0.3, 1) 20ms
          both;
      }
      .app-loading__source-pulse {
        opacity: 0;
        animation: app-loading-source-pulse 360ms cubic-bezier(0.16, 1, 0.3, 1)
          70ms both;
      }
      .app-loading__sweep {
        stroke-dasharray: 1;
        stroke-dashoffset: 0;
        animation: app-loading-sweep 430ms cubic-bezier(0.2, 0.7, 0.2, 1) 80ms
          both;
      }
      .app-loading__runner {
        opacity: 0;
        stroke-dasharray: 0.08 0.92;
        animation: app-loading-runner 470ms linear 70ms both;
      }
      .app-loading__artifact {
        animation: app-loading-artifact 220ms cubic-bezier(0.16, 1, 0.3, 1)
          340ms both;
      }
      .app-loading__artifact-slot {
        transform-origin: left center;
        animation: app-loading-artifact-slot 140ms cubic-bezier(0.16, 1, 0.3, 1)
          440ms both;
      }
      .app-loading--exit {
        animation: app-loading-exit 180ms cubic-bezier(0.4, 0, 1, 1) both;
      }
      .app-loading--exit .app-loading__mark {
        animation: app-loading-mark-exit 180ms cubic-bezier(0.16, 1, 0.3, 1)
          both;
      }
      @keyframes app-loading-mark {
        0% {
          opacity: 0.55;
          transform: scale(0.94);
        }
        18%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes app-loading-halo {
        0% {
          opacity: 0;
          transform: scale(0.35);
        }
        55% {
          opacity: 0.32;
          transform: scale(1.15);
        }
        100% {
          opacity: 0;
          transform: scale(1.55);
        }
      }
      @keyframes app-loading-source {
        from {
          opacity: 0;
          transform: scale(0.35);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes app-loading-source-pulse {
        0% {
          opacity: 0.5;
          transform: scale(0.55);
        }
        100% {
          opacity: 0;
          transform: scale(1.85);
        }
      }
      @keyframes app-loading-sweep {
        from {
          stroke-dashoffset: 1;
        }
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes app-loading-runner {
        0% {
          opacity: 0;
          stroke-dashoffset: 0.08;
        }
        12% {
          opacity: 0.48;
        }
        76% {
          opacity: 0.32;
        }
        100% {
          opacity: 0;
          stroke-dashoffset: -0.92;
        }
      }
      @keyframes app-loading-artifact {
        from {
          opacity: 0;
          transform: translate(-16px, 14px) scale(0.42, 0.72);
        }
        to {
          opacity: 1;
          transform: translate(0, 0) scale(1);
        }
      }
      @keyframes app-loading-artifact-slot {
        from {
          opacity: 0;
          transform: scaleX(0.12);
        }
        to {
          opacity: 1;
          transform: scaleX(1);
        }
      }
      @keyframes app-loading-mark-exit {
        to {
          opacity: 0;
          transform: scale(1.06);
        }
      }
      @keyframes app-loading-exit {
        to {
          opacity: 0;
        }
      }
      @keyframes app-loading-fade {
        to {
          opacity: 0;
        }
      }
      .app-loading--failed .app-loading__stage {
        display: none;
      }
      .app-loading__failure {
        display: grid;
        justify-items: center;
        gap: 12px;
        padding: 16px;
        color: CanvasText;
        text-align: center;
        pointer-events: auto;
        font:
          14px/1.5 system-ui,
          sans-serif;
      }
      .app-loading__failure p {
        margin: 0;
      }
      .app-loading__failure button {
        font: inherit;
        padding: 6px 14px;
        border: 1px solid currentColor;
        border-radius: 8px;
        background: transparent;
        color: inherit;
        cursor: pointer;
      }
      @media (prefers-reduced-motion: reduce) {
        .app-loading__halo,
        .app-loading__mark,
        .app-loading__source,
        .app-loading__source-pulse,
        .app-loading__sweep,
        .app-loading__runner,
        .app-loading__artifact,
        .app-loading__artifact-slot {
          animation: none;
        }
        .app-loading--exit {
          animation: app-loading-fade 100ms linear both;
        }
        .app-loading--exit .app-loading__mark {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
