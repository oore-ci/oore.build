name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and publish
        required: true
        type: string

concurrency:
  # Every channel publishes one shared signed index. Serialize the complete
  # publication path so an older snapshot cannot replace a newer one.
  group: release-publication
  queue: max

env:
  RELEASE_TAG: ${{ inputs.tag }}

permissions:
  actions: read
  contents: read

jobs:
  source:
    name: Resolve immutable release source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Check out the trusted release tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          sparse-checkout: tools/require-current-release.sh
          sparse-checkout-cone-mode: false
          path: trusted

      - name: Resolve release tag commit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          expected_workflow_ref="${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/heads/master"
          [[ "$GITHUB_REF" == refs/heads/master && "$GITHUB_WORKFLOW_REF" == "$expected_workflow_ref" ]] || {
            echo 'Dispatch release.yml from the protected master branch.' >&2
            exit 1
          }
          [[ "$REQUESTED_RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta)\.[0-9]+)?$ ]] || {
            echo 'The release input must be a stable, alpha, or beta tag.' >&2
            exit 1
          }

          bash trusted/tools/require-current-release.sh "$REQUESTED_RELEASE_TAG"

          read -r object_type object_sha < <(
            gh api \
              "repos/$GITHUB_REPOSITORY/git/ref/tags/$REQUESTED_RELEASE_TAG" \
              --jq '[.object.type, .object.sha] | @tsv'
          )
          for _ in 1 2 3 4 5; do
            case "$object_type" in
              commit)
                [[ "$object_sha" =~ ^[0-9a-f]{40}$ ]] || {
                  echo 'The release tag did not resolve to a valid commit.' >&2
                  exit 1
                }
                printf 'commit=%s\n' "$object_sha" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              tag)
                read -r object_type object_sha < <(
                  gh api \
                    "repos/$GITHUB_REPOSITORY/git/tags/$object_sha" \
                    --jq '[.object.type, .object.sha] | @tsv'
                )
                ;;
              *)
                echo 'The release tag does not point to a commit.' >&2
                exit 1
                ;;
            esac
          done
          echo 'The release tag has too many nested tag objects.' >&2
          exit 1

  # Runs beside the Rust builds instead of before them. Nothing is signed or
  # published until it passes, because the release job needs it.
  acceptance:
    name: Hermetic release acceptance
    needs: source
    runs-on: ${{ vars.RUNNER_MACOS || 'macos-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.source.outputs.commit }}

      - name: Validate release version
        run: bash tools/validate-release-tag.sh "$RELEASE_TAG"

      # Alpha only moves through a pull request that passed "Required
      # validation", which already ran these Rust checks on the same tree.
      # An alpha tag on alpha skips the repeat. Stable, beta, and an alpha
      # tag anywhere else run it.
      - name: Decide whether the Rust checks already ran
        env:
          RELEASE_COMMIT: ${{ needs.source.outputs.commit }}
        run: |
          set -euo pipefail
          skip=false
          if [[ "$RELEASE_TAG" == *-alpha.* ]] && git merge-base --is-ancestor "$RELEASE_COMMIT" origin/alpha; then
            skip=true
            echo 'Alpha release: Required validation on the alpha pull request covered the Rust checks.'
          fi
          echo "SKIP_RUST_ACCEPTANCE=$skip" >> "$GITHUB_ENV"

      # Tags cut before rust-toolchain.toml existed build with the image's rustc.
      - name: Install pinned Rust toolchain
        if: env.SKIP_RUST_ACCEPTANCE != 'true'
        run: |
          if [[ -f rust-toolchain.toml ]]; then
            rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          fi

      - name: Setup Bun
        if: env.SKIP_RUST_ACCEPTANCE != 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: env.SKIP_RUST_ACCEPTANCE != 'true'
        with:
          cache-bin: false
          cache-on-failure: true

      - name: Run hermetic release acceptance
        if: env.SKIP_RUST_ACCEPTANCE != 'true'
        run: make release-smoke

  # Starts once the GitHub Release is published, beside the release index
  # and installer jobs rather than after them.
  deploy:
    name: Deploy Pages
    needs: [source, acceptance, release, publish-release]
    runs-on: ${{ vars.RUNNER_MACOS || 'macos-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.source.outputs.commit }}

      - name: Check out the trusted release tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          sparse-checkout: tools/require-current-release.sh
          sparse-checkout-cone-mode: false
          path: trusted

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-web-dist-${{ needs.source.outputs.commit }}
          path: apps/web/dist

      - name: Build and deploy Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: bf288a8d0e450c22157076593bc1f6be
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.source.outputs.commit }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"

          resolve_tag_commit() {
            local object_type object_sha
            read -r object_type object_sha < <(
              gh api \
                "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" \
                --jq '[.object.type, .object.sha] | @tsv'
            )
            for _ in 1 2 3 4 5; do
              case "$object_type" in
                commit) printf '%s\n' "$object_sha"; return 0 ;;
                tag)
                  read -r object_type object_sha < <(
                    gh api \
                      "repos/$GITHUB_REPOSITORY/git/tags/$object_sha" \
                      --jq '[.object.type, .object.sha] | @tsv'
                  )
                  ;;
                *) return 1 ;;
              esac
            done
            return 1
          }
          current_tag_commit="$(resolve_tag_commit)" || {
            echo 'The release tag does not resolve to a commit.' >&2
            exit 1
          }
          [[ "$current_tag_commit" == "$RELEASE_COMMIT" ]] || {
            echo 'The release tag moved after source resolution.' >&2
            exit 1
          }
          # A rerun of an older run must not deploy older Pages over newer ones.
          bash trusted/tools/require-current-release.sh "$tag"
          pages_branch="stable"
          if echo "$tag" | grep -q -- '-alpha\.'; then
            pages_branch="alpha"
          elif echo "$tag" | grep -q -- '-beta\.'; then
            pages_branch="beta"
          fi

          export PAGES_PROJECT_DOCS="oore-docs"
          export PAGES_PROJECT_WEB="oore-ci"
          export PAGES_PROJECT_DEMO="oore-demo"
          export PAGES_PROJECT_SITE="oore"
          export PAGES_BRANCH="$pages_branch"
          PAGES_COMMIT_HASH="$RELEASE_COMMIT"
          export PAGES_COMMIT_HASH
          export PAGES_COMMIT_MESSAGE="$tag"
          export WRANGLER="./node_modules/.bin/wrangler"

          make build-docs

          deploy_pages() {
            local target="$1"
            local attempt log_file delay
            log_file="$(mktemp)"
            trap 'rm -f "$log_file"' RETURN

            for attempt in 1 2 3 4; do
              if make "$target" 2>&1 | tee "$log_file"; then
                return 0
              fi

              if ! grep -Eq '(HTTP status|status code:)[[:space:]]*5[0-9]{2}' "$log_file"; then
                echo "${target} failed with a non-transient error; not retrying."
                return 1
              fi

              if [ "$attempt" -eq 4 ]; then
                echo "${target} still failed after ${attempt} attempts."
                return 1
              fi

              delay=$((attempt * 15))
              echo "${target} hit a transient Cloudflare API error; retrying in ${delay}s (${attempt}/4)."
              sleep "$delay"
            done
          }

          # Deploy serially so one release does not burst Cloudflare's Pages API.
          deploy_pages deploy-docs-dist
          deploy_pages deploy-web-dist

          make build-demo
          deploy_pages deploy-demo-dist

          # Stable site publication stays behind the signed-installer job.
          # Alpha and beta need a candidate preview for site acceptance.
          if [ "$pages_branch" != "stable" ]; then
            make build-site
            deploy_pages deploy-site-dist
          fi

  rust:
    name: Build Rust (${{ matrix.arch }})
    needs: source
    runs-on: ${{ vars.RUNNER_MACOS || 'macos-latest' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.commit }}

      # Tags cut before rust-toolchain.toml existed build with the image's rustc.
      - name: Install pinned Rust toolchain
        run: |
          if [[ -f rust-toolchain.toml ]]; then
            rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          fi

      - name: Setup Rust target
        run: rustup target add "${{ matrix.target }}"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-bin: false
          cache-on-failure: true
          cache-workspace-crates: true
          key: ${{ matrix.target }}

      - name: Build Rust
        run: |
          cargo build --release -p oored -p oore --target "${{ matrix.target }}" --locked
          mkdir -p dist/rust
          cp "target/${{ matrix.target }}/release/oored" dist/rust/oored
          cp "target/${{ matrix.target }}/release/oore" dist/rust/oore

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-${{ matrix.arch }}-${{ needs.source.outputs.commit }}
          path: dist/rust
          if-no-files-found: error

  release:
    name: Build release assets
    needs: [source, acceptance, rust]
    runs-on: ${{ vars.RUNNER_MACOS || 'macos-latest' }}
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.source.outputs.commit }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-arm64-${{ needs.source.outputs.commit }}
          path: dist/rust/arm64

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-x86_64-${{ needs.source.outputs.commit }}
          path: dist/rust/x86_64

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web
        run: make build-web

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-web-dist-${{ needs.source.outputs.commit }}
          path: apps/web/dist
          if-no-files-found: error

      - name: Compile standalone web server
        run: make compile-web-release-launchers WEB_RELEASE_OUTPUT=dist

      - name: Validate standalone web server
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64) launcher=dist/oore-web-arm64 ;;
            x86_64) launcher=dist/oore-web-x86_64 ;;
            *) echo "Unsupported release runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac

          "$launcher" validate-config \
            --listen 100.64.10.30:4174 \
            --backend-url http://100.64.10.20:8787 \
            --browser-transport-protected \
            --backend-transport-protected \
            --dist-dir apps/web/dist

          if "$launcher" validate-config \
            --listen 100.64.10.30:4174 \
            --backend-url http://100.64.10.20:8787 \
            --browser-transport-protected \
            --dist-dir apps/web/dist; then
            echo 'Standalone launcher accepted an unprotected remote HTTP backend.' >&2
            exit 1
          fi

          if "$launcher" validate-config \
            --listen 100.64.10.30:4174 \
            --backend-url http://100.64.10.20:8787 \
            --backend-transport-protected \
            --dist-dir apps/web/dist; then
            echo 'Standalone launcher accepted an unprotected non-loopback listener.' >&2
            exit 1
          fi

      - name: Package release tarballs
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          ver="${tag#v}"
          mkdir -p "dist/releases/$tag"

          stage_arm="dist/stage-arm64"
          stage_x64="dist/stage-x86_64"
          stage_cli_arm="dist/stage-cli-darwin-arm64"
          stage_cli_x64="dist/stage-cli-darwin-x86_64"
          stage_web_darwin_arm="dist/stage-web-darwin-arm64"
          stage_web_darwin_x64="dist/stage-web-darwin-x86_64"
          stage_web_linux_arm="dist/stage-web-linux-arm64"
          stage_web_linux_x64="dist/stage-web-linux-x86_64"
          rm -rf "$stage_arm" "$stage_x64" "$stage_cli_arm" "$stage_cli_x64" "$stage_web_darwin_arm" "$stage_web_darwin_x64" "$stage_web_linux_arm" "$stage_web_linux_x64"
          mkdir -p "$stage_arm/bin" "$stage_x64/bin"
          mkdir -p "$stage_cli_arm/bin" "$stage_cli_x64/bin"
          mkdir -p "$stage_web_darwin_arm/bin" "$stage_web_darwin_x64/bin"
          mkdir -p "$stage_web_linux_arm/bin" "$stage_web_linux_x64/bin"

          install -m 0755 "dist/rust/arm64/oored" "$stage_arm/bin/oored"
          install -m 0755 "dist/rust/arm64/oore"  "$stage_arm/bin/oore"
          install -m 0755 "dist/oore-web-arm64" "$stage_arm/bin/oore-web"
          cp -R "apps/web/dist" "$stage_arm/web-dist"
          cp "LICENSE" "$stage_arm/LICENSE"
          printf '%s\n' "$ver" > "$stage_arm/VERSION"

          install -m 0755 "dist/rust/x86_64/oored" "$stage_x64/bin/oored"
          install -m 0755 "dist/rust/x86_64/oore"  "$stage_x64/bin/oore"
          install -m 0755 "dist/oore-web-x86_64" "$stage_x64/bin/oore-web"
          cp -R "apps/web/dist" "$stage_x64/web-dist"
          cp "LICENSE" "$stage_x64/LICENSE"
          printf '%s\n' "$ver" > "$stage_x64/VERSION"

          install -m 0755 "dist/rust/arm64/oore" "$stage_cli_arm/bin/oore"
          cp "LICENSE" "$stage_cli_arm/LICENSE"
          printf '%s\n' "$ver" > "$stage_cli_arm/VERSION"

          install -m 0755 "dist/rust/x86_64/oore" "$stage_cli_x64/bin/oore"
          cp "LICENSE" "$stage_cli_x64/LICENSE"
          printf '%s\n' "$ver" > "$stage_cli_x64/VERSION"

          install -m 0755 "dist/oore-web-arm64" "$stage_web_darwin_arm/bin/oore-web"
          cp -R "apps/web/dist" "$stage_web_darwin_arm/web-dist"
          cp "LICENSE" "$stage_web_darwin_arm/LICENSE"
          printf '%s\n' "$ver" > "$stage_web_darwin_arm/VERSION"

          install -m 0755 "dist/oore-web-x86_64" "$stage_web_darwin_x64/bin/oore-web"
          cp -R "apps/web/dist" "$stage_web_darwin_x64/web-dist"
          cp "LICENSE" "$stage_web_darwin_x64/LICENSE"
          printf '%s\n' "$ver" > "$stage_web_darwin_x64/VERSION"

          install -m 0755 "dist/oore-web-linux-arm64" "$stage_web_linux_arm/bin/oore-web"
          cp -R "apps/web/dist" "$stage_web_linux_arm/web-dist"
          cp "LICENSE" "$stage_web_linux_arm/LICENSE"
          printf '%s\n' "$ver" > "$stage_web_linux_arm/VERSION"

          install -m 0755 "dist/oore-web-linux-x86_64" "$stage_web_linux_x64/bin/oore-web"
          cp -R "apps/web/dist" "$stage_web_linux_x64/web-dist"
          cp "LICENSE" "$stage_web_linux_x64/LICENSE"
          printf '%s\n' "$ver" > "$stage_web_linux_x64/VERSION"

          [[ -x "$stage_arm/bin/oore" && -x "$stage_arm/bin/oored" && -x "$stage_arm/bin/oore-web" ]]
          [[ -x "$stage_x64/bin/oore" && -x "$stage_x64/bin/oored" && -x "$stage_x64/bin/oore-web" ]]

          make package-release-assets \
            RELEASE_TAG="$tag" \
            RELEASE_OUTPUT="dist/releases/$tag" \
            RELEASE_FULL_ARM64_STAGE="$stage_arm" \
            RELEASE_FULL_X86_64_STAGE="$stage_x64" \
            RELEASE_CLI_ARM64_STAGE="$stage_cli_arm" \
            RELEASE_CLI_X86_64_STAGE="$stage_cli_x64" \
            RELEASE_WEB_DARWIN_ARM64_STAGE="$stage_web_darwin_arm" \
            RELEASE_WEB_DARWIN_X86_64_STAGE="$stage_web_darwin_x64" \
            RELEASE_WEB_LINUX_ARM64_STAGE="$stage_web_linux_arm" \
            RELEASE_WEB_LINUX_X86_64_STAGE="$stage_web_linux_x64"

      - name: Generate release notes
        env:
          RELEASE_COMMIT: ${{ needs.source.outputs.commit }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"

          channel="prod"
          if echo "$tag" | grep -q -- '-alpha\.'; then
            channel="alpha"
          elif echo "$tag" | grep -q -- '-beta\.'; then
            channel="beta"
          fi

          prev=""
          if [ "$channel" = "alpha" ]; then
            prev="$(git tag -l 'v*-alpha.*' --sort=-v:refname | grep -v -F "$tag" | head -n1 || true)"
          elif [ "$channel" = "beta" ]; then
            prev="$(git tag -l 'v*-beta.*' --sort=-v:refname | grep -v -F "$tag" | head -n1 || true)"
          else
            prev="$(git tag -l 'v*' --sort=-v:refname | grep -v -- '-' | grep -v -F "$tag" | head -n1 || true)"
          fi

          repo="${GITHUB_REPOSITORY}"
          out="dist/releases/$tag/RELEASE_NOTES.md"

          {
            echo "# $tag"
            echo

            if [ -n "$prev" ]; then
              echo "Changes since $prev:"
              echo
              git log --no-merges --pretty=format:'- %s (%h)' "refs/tags/$prev..$RELEASE_COMMIT" | grep -v '^- chore(release): bump version to ' || true
              echo
              echo "**Full Changelog**: https://github.com/$repo/compare/$prev...$tag"
            else
              echo "Changes:"
              echo
              git log --no-merges --pretty=format:'- %s (%h)' "$RELEASE_COMMIT" | grep -v '^- chore(release): bump version to ' || true
              echo
              echo "**Full Changelog**: https://github.com/$repo/releases/tag/$tag"
            fi
            echo
          } > "$out"

      - name: Record release source
        env:
          RELEASE_COMMIT: ${{ needs.source.outputs.commit }}
        run: |
          source_file="dist/releases/$RELEASE_TAG/SOURCE_COMMIT"
          rm -f "$source_file"
          printf '%s\n' "$RELEASE_COMMIT" > "$source_file"

      - name: Upload unsigned release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-release-assets-${{ needs.source.outputs.commit }}
          path: dist/releases/${{ env.RELEASE_TAG }}
          if-no-files-found: error
          retention-days: 7

  sign-release-assets:
    name: Sign release assets
    needs: [source, release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release-signing
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
      - uses: ./.github/actions/sign-release-metadata
        with:
          artifact-name: unsigned-release-assets-${{ needs.source.outputs.commit }}
          output-artifact-name: signed-release-assets-${{ needs.source.outputs.commit }}
          release-commit: ${{ needs.source.outputs.commit }}
          release-tag: ${{ inputs.tag }}
          signing-kind: release-manifest
          signing-key: ${{ secrets.OORE_RELEASE_SIGNING_KEY }}

  publish-release:
    name: Publish GitHub Release
    needs: [source, sign-release-assets]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release-publication
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download signed release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-release-assets-${{ needs.source.outputs.commit }}
          path: dist/releases/${{ env.RELEASE_TAG }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_PUBLICATION_TOKEN: ${{ secrets.OORE_RELEASE_PUBLICATION_TOKEN }}
          RELEASE_COMMIT: ${{ needs.source.outputs.commit }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"

          require_immutable_release_policy() {
            [[ -n "$RELEASE_PUBLICATION_TOKEN" ]] || {
              echo 'The protected OORE_RELEASE_PUBLICATION_TOKEN secret is required.' >&2
              exit 1
            }
            policy="$({
              GH_TOKEN="$RELEASE_PUBLICATION_TOKEN" gh api \
                --header 'X-GitHub-Api-Version: 2026-03-10' \
                "repos/$GITHUB_REPOSITORY/immutable-releases"
            })" || {
              echo 'Failed to verify the repository Immutable Releases policy.' >&2
              exit 1
            }
            jq -e '.enabled == true' <<<"$policy" >/dev/null || {
              echo 'GitHub Immutable Releases must be enabled before Oore can publish.' >&2
              exit 1
            }
          }

          require_published_release_is_immutable() {
            local release_json=""
            for _ in 1 2 3 4 5 6; do
              if release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" 2>/dev/null)"; then
                if jq -e '.draft == false and .immutable == true' <<<"$release_json" >/dev/null; then
                  return 0
                fi
              fi
              sleep 5
            done
            echo "Release $tag did not become immutable after publication." >&2
            return 1
          }

          resolve_tag_commit() {
            local object_type object_sha
            read -r object_type object_sha < <(
              gh api \
                "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" \
                --jq '[.object.type, .object.sha] | @tsv'
            )
            for _ in 1 2 3 4 5; do
              case "$object_type" in
                commit) printf '%s\n' "$object_sha"; return 0 ;;
                tag)
                  read -r object_type object_sha < <(
                    gh api \
                      "repos/$GITHUB_REPOSITORY/git/tags/$object_sha" \
                      --jq '[.object.type, .object.sha] | @tsv'
                  )
                  ;;
                *) return 1 ;;
              esac
            done
            return 1
          }
          current_tag_commit="$(resolve_tag_commit)" || {
            echo 'The release tag does not resolve to a commit.' >&2
            exit 1
          }
          [[ "$current_tag_commit" == "$RELEASE_COMMIT" ]] || {
            echo 'The release tag moved after source resolution.' >&2
            exit 1
          }

          require_immutable_release_policy

          prerelease=false
          release_flags=()
          if [[ "$tag" == *-alpha.* || "$tag" == *-beta.* ]]; then
            prerelease=true
            release_flags+=(--prerelease)
          fi

          notes="dist/releases/$tag/RELEASE_NOTES.md"
          dir="dist/releases/$tag"
          [[ ! -e "$dir/SOURCE_COMMIT" ]] || {
            echo 'The internal release source marker was not removed.' >&2
            exit 1
          }

          expected_files=("$dir"/*.tar.gz "$dir"/*.txt "$dir"/*.sig "$notes")
          comparison="$(mktemp -d)"
          trap 'rm -rf "$comparison"' EXIT
          for file in "${expected_files[@]}"; do
            [[ -f "$file" && ! -L "$file" ]] || {
              echo "The signed release asset is not a regular file: $file" >&2
              exit 1
            }
            printf '%s\tsha256:%s\t%s\tuploaded\n' \
              "$(basename "$file")" \
              "$(sha256sum "$file" | awk '{print $1}')" \
              "$(stat -c '%s' "$file")"
          done | LC_ALL=C sort > "$comparison/expected-assets.tsv"

          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --slurp \
            > "$comparison/releases.json"
          release_count="$(
            jq --arg tag "$tag" '[.[][] | select(.tag_name == $tag)] | length' \
              "$comparison/releases.json"
          )"
          [[ "$release_count" =~ ^[0-9]+$ && "$release_count" -le 1 ]] || {
            echo "GitHub returned multiple releases for $tag." >&2
            exit 1
          }
          if [[ "$release_count" == 1 ]]; then
            jq --arg tag "$tag" '[.[][] | select(.tag_name == $tag)][0]' \
              "$comparison/releases.json" > "$comparison/release.json"
            jq -e \
              --arg tag "$tag" \
              --argjson prerelease "$prerelease" \
              '.tag_name == $tag and .prerelease == $prerelease' \
              "$comparison/release.json" >/dev/null || {
                echo "The existing release metadata does not match $tag." >&2
                exit 1
              }
            jq -r '.assets[] | [.name, .digest, (.size | tostring), .state] | @tsv' \
              "$comparison/release.json" | LC_ALL=C sort > "$comparison/actual-assets.tsv"
            if [[ "$(jq -r '.draft' "$comparison/release.json")" == false ]]; then
              # Rebuilt tarballs are not byte-identical to the published ones,
              # so a re-dispatch keeps the published, immutable assets. It
              # only checks that every expected asset is there and uploaded.
              jq -e '.immutable == true' "$comparison/release.json" >/dev/null || {
                echo "Published release $tag is not immutable. Refusing to continue." >&2
                exit 1
              }
              cmp \
                <(cut -f1,4 "$comparison/expected-assets.tsv") \
                <(cut -f1,4 "$comparison/actual-assets.tsv") || {
                  echo "Published release $tag has a different asset set. Repair it by hand." >&2
                  exit 1
                }
              if cmp -s "$comparison/expected-assets.tsv" "$comparison/actual-assets.tsv"; then
                echo "Release $tag already contains the exact signed assets; continuing."
              else
                echo "Release $tag is already published; keeping its signed assets."
              fi
              require_published_release_is_immutable
              exit 0
            fi
            if ! cmp -s "$comparison/expected-assets.tsv" "$comparison/actual-assets.tsv"; then
              # A draft is never public and is still mutable. Replace an
              # interrupted or outdated draft instead of failing every rerun.
              echo "Replacing draft release $tag, whose assets differ from this run."
              GH_TOKEN="$RELEASE_PUBLICATION_TOKEN" gh release delete "$tag" --yes
              release_count=0
            else
              require_immutable_release_policy
              GH_TOKEN="$RELEASE_PUBLICATION_TOKEN" gh release edit "$tag" \
                --draft=false \
                --title "$tag" \
                "${release_flags[@]}" \
                --notes-file "$notes"
            fi
          fi
          if [[ "$release_count" == 0 ]]; then
            # Create the release as a draft. Publish it only after every
            # immutable asset is attached successfully.
            GH_TOKEN="$RELEASE_PUBLICATION_TOKEN" gh release create "$tag" \
              "${expected_files[@]}" \
              --verify-tag \
              --draft \
              --title "$tag" \
              "${release_flags[@]}" \
              --notes-file "$notes"
            require_immutable_release_policy
            GH_TOKEN="$RELEASE_PUBLICATION_TOKEN" gh release edit "$tag" \
              --draft=false \
              --title "$tag" \
              "${release_flags[@]}" \
              --notes-file "$notes"
          fi
          require_published_release_is_immutable

  release-index:
    name: Build release index
    needs: [source, publish-release]
    runs-on: ${{ vars.RUNNER_MACOS || 'macos-latest' }}
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.source.outputs.commit }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate channel manifests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            *-alpha.*) release_channel=alpha ;;
            *-beta.*) release_channel=beta ;;
            *) release_channel=stable ;;
          esac
          mkdir -p dist
          for attempt in 1 2 3 4 5 6; do
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --slurp > dist/github-releases.json
            make build-release-index
            if jq -e --arg tag "$RELEASE_TAG" '.tag == $tag' "dist/release-index/latest/$release_channel.json" >/dev/null; then
              exit 0
            fi
            if [[ "$attempt" == 6 ]]; then
              echo "The published release did not become the latest $release_channel entry." >&2
              exit 1
            fi
            sleep 10
          done

      - name: Record release source
        env:
          RELEASE_COMMIT: ${{ needs.source.outputs.commit }}
        run: |
          source_file="dist/release-index/SOURCE_COMMIT"
          rm -f "$source_file"
          printf '%s\n' "$RELEASE_COMMIT" > "$source_file"

      - name: Upload unsigned release index
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-release-index-${{ needs.source.outputs.commit }}
          path: dist/release-index
          if-no-files-found: error
          retention-days: 7

  sign-release-index:
    name: Sign release index
    needs: [source, release-index]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release-signing
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
      - uses: ./.github/actions/sign-release-metadata
        with:
          artifact-name: unsigned-release-index-${{ needs.source.outputs.commit }}
          output-artifact-name: signed-release-index-${{ needs.source.outputs.commit }}
          release-commit: ${{ needs.source.outputs.commit }}
          release-tag: ${{ inputs.tag }}
          signing-kind: release-index
          signing-key: ${{ secrets.OORE_RELEASE_SIGNING_KEY }}

  deploy-installer:
    name: Deploy signed installer
    needs: [source, sign-release-index]
    runs-on: ${{ vars.RUNNER_MACOS || 'macos-latest' }}
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - name: Resolve the published stable site source
        id: site-source
        env:
          GH_TOKEN: ${{ github.token }}
        # Build the site from the newest published stable release, not the
        # moving stable branch, so an alpha release never ships stable
        # content that has not been released.
        run: |
          set -euo pipefail
          stable_tag="$(
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' |
              { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V | tail -n1
          )"
          if [[ -n "$stable_tag" ]]; then
            printf 'ref=refs/tags/%s\n' "$stable_tag" >> "$GITHUB_OUTPUT"
          else
            echo '::warning::No stable release is published yet. Building the site from the stable branch.'
            printf 'ref=refs/heads/stable\n' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ steps.site-source.outputs.ref }}
          path: site-source

      - name: Check out the trusted installer source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          path: trusted

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        working-directory: site-source
        run: bun install --frozen-lockfile

      - name: Install trusted deploy dependencies
        working-directory: trusted
        run: bun install --frozen-lockfile

      - name: Build signed installer
        run: |
          set -euo pipefail
          # Build stable site content, then replace only the public installer
          # endpoints with scripts generated from the protected master commit.
          bash trusted/tools/sync-install-scripts.sh
          make -C site-source build-site
          install -m 0644 trusted/apps/site/public/install site-source/apps/site/dist/install
          install -m 0644 trusted/apps/site/public/uninstall site-source/apps/site/dist/uninstall

      - name: Deploy signed installer
        env:
          CLOUDFLARE_ACCOUNT_ID: bf288a8d0e450c22157076593bc1f6be
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.source.outputs.commit }}
          PAGES_COMMIT_MESSAGE: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail

          resolve_tag_commit() {
            local object_type object_sha
            read -r object_type object_sha < <(
              gh api \
                "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
                --jq '[.object.type, .object.sha] | @tsv'
            )
            for _ in 1 2 3 4 5; do
              case "$object_type" in
                commit) printf '%s\n' "$object_sha"; return 0 ;;
                tag)
                  read -r object_type object_sha < <(
                    gh api \
                      "repos/$GITHUB_REPOSITORY/git/tags/$object_sha" \
                      --jq '[.object.type, .object.sha] | @tsv'
                  )
                  ;;
                *) return 1 ;;
              esac
            done
            return 1
          }
          current_tag_commit="$(resolve_tag_commit)" || {
            echo 'The release tag does not resolve to a commit.' >&2
            exit 1
          }
          [[ "$current_tag_commit" == "$RELEASE_COMMIT" ]] || {
            echo 'The release tag moved after source resolution.' >&2
            exit 1
          }
          # Every channel shares the installer, so only the most recently
          # published release may deploy it.
          bash trusted/tools/require-current-release.sh "$RELEASE_TAG" --most-recent

          PAGES_COMMIT_HASH="$(git -C site-source rev-parse HEAD)"
          "$GITHUB_WORKSPACE/trusted/node_modules/.bin/wrangler" pages deploy \
            site-source/apps/site/dist \
            --project-name=oore \
            --commit-hash="$PAGES_COMMIT_HASH" \
            --commit-message="$PAGES_COMMIT_MESSAGE" \
            --commit-dirty=true

  deploy-release-index:
    name: Deploy release index
    needs: [source, sign-release-index, deploy-installer]
    runs-on: ${{ vars.RUNNER_MACOS || 'macos-latest' }}
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.source.outputs.commit }}

      - name: Check out the trusted release tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          sparse-checkout: tools/require-current-release.sh
          sparse-checkout-cone-mode: false
          path: trusted

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download signed release index
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-release-index-${{ needs.source.outputs.commit }}
          path: dist/release-index

      - name: Deploy release index
        env:
          CLOUDFLARE_ACCOUNT_ID: bf288a8d0e450c22157076593bc1f6be
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          PAGES_COMMIT_MESSAGE: ${{ env.RELEASE_TAG }}
          RELEASE_COMMIT: ${{ needs.source.outputs.commit }}
          WRANGLER: ./node_modules/.bin/wrangler
        run: |
          set -euo pipefail
          resolve_tag_commit() {
            local object_type object_sha
            read -r object_type object_sha < <(
              gh api \
                "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
                --jq '[.object.type, .object.sha] | @tsv'
            )
            for _ in 1 2 3 4 5; do
              case "$object_type" in
                commit) printf '%s\n' "$object_sha"; return 0 ;;
                tag)
                  read -r object_type object_sha < <(
                    gh api \
                      "repos/$GITHUB_REPOSITORY/git/tags/$object_sha" \
                      --jq '[.object.type, .object.sha] | @tsv'
                  )
                  ;;
                *) return 1 ;;
              esac
            done
            return 1
          }
          current_tag_commit="$(resolve_tag_commit)" || {
            echo 'The release tag does not resolve to a commit.' >&2
            exit 1
          }
          [[ "$current_tag_commit" == "$RELEASE_COMMIT" ]] || {
            echo 'The release tag moved after source resolution.' >&2
            exit 1
          }
          [[ ! -e dist/release-index/SOURCE_COMMIT ]] || {
            echo 'The internal release source marker was not removed.' >&2
            exit 1
          }
          # The index carries every channel. Deploy it only while each
          # channel's latest entry is still the newest published release.
          bash trusted/tools/require-current-release.sh "$RELEASE_TAG" --index dist/release-index

          PAGES_COMMIT_HASH="$RELEASE_COMMIT"
          export PAGES_COMMIT_HASH
          log_file="$(mktemp)"
          trap 'rm -f "$log_file"' EXIT

          for attempt in 1 2 3 4; do
            if make deploy-release-index-dist 2>&1 | tee "$log_file"; then
              exit 0
            fi
            if ! grep -Eq '(HTTP status|status code:)[[:space:]]*5[0-9]{2}' "$log_file" || [ "$attempt" -eq 4 ]; then
              exit 1
            fi
            sleep $((attempt * 15))
          done
