name: Sign release metadata

on:
  workflow_call:
    inputs:
      artifact-name:
        description: Unsigned artifact from the caller run
        required: true
        type: string
      output-artifact-name:
        description: Signed artifact for the caller run
        required: true
        type: string
      release-commit:
        description: Immutable release source commit
        required: true
        type: string
      release-tag:
        description: Exact release tag for a checksum manifest
        required: true
        type: string
      signing-kind:
        description: Metadata set to sign
        required: true
        type: string
    secrets:
      OORE_RELEASE_SIGNING_KEY:
        description: Protected Ed25519 release-signing private key
        required: false
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  preflight-and-sign:
    name: Preflight key and sign metadata
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release-signing
    steps:
      - name: Validate the trusted workflow source
        shell: bash
        env:
          OORE_SIGNING_KIND: ${{ inputs.signing-kind }}
          OORE_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          if [[ -n "$OORE_SIGNING_KIND" ]]; then
            expected_workflow_ref="${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/heads/master"
          else
            expected_workflow_ref="${GITHUB_REPOSITORY}/.github/workflows/sign-release-metadata.yml@refs/heads/master"
          fi
          [[ "$GITHUB_REF" == refs/heads/master && "$OORE_WORKFLOW_REF" == "$expected_workflow_ref" ]] || {
            echo 'The signing workflow must come from the protected master branch.' >&2
            exit 1
          }

      - name: Checkout the trusted signing boundary
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          sparse-checkout: |
            tools/release-signing-key.pub
            tools/sign-release-manifest.sh
          sparse-checkout-cone-mode: false
          path: trusted

      - name: Validate the signing request
        if: inputs.signing-kind != ''
        shell: bash
        env:
          OORE_RELEASE_COMMIT: ${{ inputs.release-commit }}
          OORE_RELEASE_TAG: ${{ inputs.release-tag }}
          OORE_SIGNING_KIND: ${{ inputs.signing-kind }}
        run: |
          set -euo pipefail
          [[ "$OORE_RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'The signer requires an immutable release commit.' >&2
            exit 1
          }
          [[ "$OORE_RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta)\.[0-9]+)?$ ]] || {
            echo "Unsupported release tag: $OORE_RELEASE_TAG" >&2
            exit 1
          }
          case "$OORE_SIGNING_KIND" in
            release-manifest|release-index) ;;
            *)
              echo "Unsupported release metadata kind: $OORE_SIGNING_KIND" >&2
              exit 1
              ;;
          esac

      - name: Checkout the candidate release pin
        if: inputs.signing-kind != ''
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.release-commit }}
          sparse-checkout: |
            Cargo.toml
            tools/release-signing-key.pub
          sparse-checkout-cone-mode: false
          path: candidate

      - name: Validate the candidate source and public key
        if: inputs.signing-kind != ''
        shell: bash
        env:
          OORE_RELEASE_COMMIT: ${{ inputs.release-commit }}
          OORE_RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          set -euo pipefail
          case "$OORE_RELEASE_TAG" in
            *-alpha.*) release_branch=alpha ;;
            *-beta.*) release_branch=beta ;;
            *) release_branch=stable ;;
          esac

          tag_commit="$(git -C candidate rev-parse "refs/tags/$OORE_RELEASE_TAG^{commit}")"
          [[ "$tag_commit" == "$OORE_RELEASE_COMMIT" ]] || {
            echo 'The release tag moved after source resolution.' >&2
            exit 1
          }
          checked_out_commit="$(git -C candidate rev-parse 'HEAD^{commit}')"
          [[ "$checked_out_commit" == "$OORE_RELEASE_COMMIT" ]] || {
            echo 'The candidate checkout does not match the immutable release commit.' >&2
            exit 1
          }
          branch_ref="refs/remotes/origin/$release_branch"
          git -C candidate show-ref --verify --quiet "$branch_ref" || {
            echo "The candidate checkout has no $release_branch release branch." >&2
            exit 1
          }
          git -C candidate merge-base --is-ancestor "$tag_commit" "$branch_ref" || {
            echo "The release tag is not part of the protected $release_branch branch." >&2
            exit 1
          }

          tag_version="${OORE_RELEASE_TAG#v}"
          tag_version="${tag_version%%-*}"
          workspace_version="$(awk '
            $0 == "[workspace.package]" { inside = 1; next }
            inside && /^\[/ { exit }
            inside && /^[[:space:]]*version[[:space:]]*=/ {
              value = $0
              sub(/^[^=]*=[[:space:]]*"/, "", value)
              sub(/"[[:space:]]*$/, "", value)
              print value
              exit
            }
          ' candidate/Cargo.toml)"
          [[ "$workspace_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo 'The release tag has no valid workspace package version.' >&2
            exit 1
          }
          [[ "$tag_version" == "$workspace_version" ]] || {
            echo 'The release tag does not match its workspace package version.' >&2
            exit 1
          }

          temporary="$(mktemp -d)"
          trap 'rm -rf "$temporary"' EXIT
          normalize_single_pin() {
            local source_file="$1"
            local output_file="$2"
            awk '
              /^[[:space:]]*($|#)/ { next }
              NF >= 2 && $1 == "ssh-ed25519" {
                count += 1
                key = $1 " " $2
                next
              }
              { invalid = 1 }
              END {
                if (invalid || count != 1) exit 1
                print key
              }
            ' "$source_file" > "$output_file" || return 1
            ssh-keygen -l -f "$output_file" >/dev/null 2>&1
          }

          normalize_single_pin \
            trusted/tools/release-signing-key.pub \
            "$temporary/trusted.pub" || {
            echo 'The trusted commit must contain exactly one valid Ed25519 release key.' >&2
            exit 1
          }
          normalize_single_pin \
            candidate/tools/release-signing-key.pub \
            "$temporary/candidate.pub" || {
            echo 'The release tag must contain exactly one valid Ed25519 release key.' >&2
            exit 1
          }
          cmp -s "$temporary/trusted.pub" "$temporary/candidate.pub" || {
            echo 'The release tag public key does not match the trusted public key.' >&2
            exit 1
          }

      - name: Preflight the release signing key
        shell: bash
        env:
          OORE_RELEASE_SIGNING_KEY: ${{ secrets.OORE_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          [[ -n "$OORE_RELEASE_SIGNING_KEY" ]] || {
            echo 'The release-signing environment has no OORE_RELEASE_SIGNING_KEY secret.' >&2
            exit 1
          }

          umask 077
          temporary="$(mktemp -d)"
          key_file="$temporary/private-key"
          derived_key_file="$temporary/derived.pub"
          trap 'rm -rf "$temporary"' EXIT
          printf '%s\n' "$OORE_RELEASE_SIGNING_KEY" > "$key_file"
          chmod 0600 "$key_file"

          ssh-keygen -y -f "$key_file" > "$derived_key_file" 2>/dev/null || {
            echo 'The release signing secret is not a readable OpenSSH private key.' >&2
            exit 1
          }

          normalize_single_pin() {
            local source_file="$1"
            local output_file="$2"
            awk '
              /^[[:space:]]*($|#)/ { next }
              NF >= 2 && $1 == "ssh-ed25519" {
                count += 1
                key = $1 " " $2
                next
              }
              { invalid = 1 }
              END {
                if (invalid || count != 1) exit 1
                print key
              }
            ' "$source_file" > "$output_file" || return 1
            ssh-keygen -l -f "$output_file" >/dev/null 2>&1
          }

          normalize_single_pin "$derived_key_file" "$temporary/normalized-derived.pub" || {
            echo 'The release signing secret does not contain an Ed25519 key.' >&2
            exit 1
          }
          normalize_single_pin trusted/tools/release-signing-key.pub "$temporary/normalized-trusted.pub" || {
            echo 'The trusted commit must contain exactly one valid Ed25519 release key.' >&2
            exit 1
          }
          cmp -s "$temporary/normalized-derived.pub" "$temporary/normalized-trusted.pub" || {
            echo 'The release signing secret does not match the trusted public key.' >&2
            exit 1
          }

          echo 'The release signing key matches the trusted public key.'

      - name: Download unsigned metadata
        if: inputs.signing-kind != ''
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: ${{ inputs.artifact-name }}
          path: payload

      - name: Validate the artifact source
        if: inputs.signing-kind != ''
        shell: bash
        env:
          OORE_RELEASE_COMMIT: ${{ inputs.release-commit }}
        run: |
          set -euo pipefail
          source_file=payload/SOURCE_COMMIT
          [[ -f "$source_file" && ! -L "$source_file" ]] || {
            echo 'The unsigned artifact has no regular source marker.' >&2
            exit 1
          }
          artifact_commit="$(tr -d '\r\n' < "$source_file")"
          [[ "$artifact_commit" == "$OORE_RELEASE_COMMIT" ]] || {
            echo 'The unsigned artifact does not match the immutable release commit.' >&2
            exit 1
          }
          rm -f "$source_file"

      - name: Sign release metadata
        if: inputs.signing-kind != ''
        shell: bash
        env:
          OORE_RELEASE_SIGNING_KEY: ${{ secrets.OORE_RELEASE_SIGNING_KEY }}
          OORE_RELEASE_TAG: ${{ inputs.release-tag }}
          OORE_SIGNING_KIND: ${{ inputs.signing-kind }}
        run: |
          set -euo pipefail
          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          chmod 0600 "$key_file"
          printf '%s\n' "$OORE_RELEASE_SIGNING_KEY" > "$key_file"

          case "$OORE_SIGNING_KIND" in
            release-manifest)
              [[ "$OORE_RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta)\.[0-9]+)?$ ]] || {
                echo "Unsupported release tag: $OORE_RELEASE_TAG" >&2
                exit 1
              }
              manifest="payload/oore_${OORE_RELEASE_TAG#v}_checksums.txt"
              bash trusted/tools/sign-release-manifest.sh \
                "$key_file" \
                oore-release-manifest@oore.build \
                "$manifest"
              ;;
            release-index)
              manifests=(
                payload/alpha.json
                payload/beta.json
                payload/stable.json
              )
              for manifest in "${manifests[@]}"; do
                [[ -f "$manifest" && ! -L "$manifest" ]] || {
                  echo "The release index is missing a required manifest: $manifest" >&2
                  exit 1
                }
              done
              shopt -s nullglob
              latest_manifests=(payload/latest/*.json)
              [[ "${#latest_manifests[@]}" -gt 0 ]] || {
                echo 'The release index has no latest channel manifest.' >&2
                exit 1
              }

              case "$OORE_RELEASE_TAG" in
                *-alpha.*) release_channel=alpha ;;
                *-beta.*) release_channel=beta ;;
                v[0-9]*.[0-9]*.[0-9]*) release_channel=stable ;;
                *)
                  echo "Unsupported release tag: $OORE_RELEASE_TAG" >&2
                  exit 1
                  ;;
              esac
              latest_manifest="payload/latest/$release_channel.json"
              history_manifest="payload/$release_channel.json"
              [[ -f "$latest_manifest" && ! -L "$latest_manifest" ]] || {
                echo "The release index lacks latest/$release_channel.json." >&2
                exit 1
              }
              jq -e \
                --arg channel "$release_channel" \
                --arg tag "$OORE_RELEASE_TAG" \
                '.schema_version == 1 and .channel == $channel and .tag == $tag' \
                "$latest_manifest" >/dev/null || {
                  echo "The latest $release_channel release is not $OORE_RELEASE_TAG." >&2
                  exit 1
                }
              jq -e \
                --arg channel "$release_channel" \
                --arg tag "$OORE_RELEASE_TAG" \
                '.schema_version == 1 and .channel == $channel and (.releases | type == "array") and .releases[0].tag == $tag and any(.releases[]; .tag == $tag)' \
                "$history_manifest" >/dev/null || {
                  echo "The $release_channel history is not headed by $OORE_RELEASE_TAG." >&2
                  exit 1
                }
              cmp \
                <(jq -S . "$latest_manifest") \
                <(jq -S '.releases[0]' "$history_manifest") || {
                  echo "The latest $release_channel manifest does not match its history entry." >&2
                  exit 1
                }
              bash trusted/tools/sign-release-manifest.sh \
                "$key_file" \
                oore-release-index@oore.build \
                "${manifests[@]}" \
                "${latest_manifests[@]}"
              ;;
            *)
              echo "Unsupported release metadata kind: $OORE_SIGNING_KIND" >&2
              exit 1
              ;;
          esac

      - name: Upload signed metadata
        if: inputs.signing-kind != ''
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ inputs.output-artifact-name }}
          path: payload
          if-no-files-found: error
          retention-days: 7
