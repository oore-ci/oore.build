name: Validate

on:
  pull_request:
    branches: [master, alpha, beta, stable]
  push:
    branches: [master, alpha, beta, stable]
  workflow_dispatch:

# Same-repo branches run on the self-hosted oore-linux (x64) and oore-mac
# (arm64) runners. Fork PRs never reach them: they fall back to GitHub-hosted
# images so untrusted code cannot touch the persistent hosts.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || vars.RUNNER_LINUX || 'oore-linux' }}
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      docs: ${{ steps.filter.outputs.docs }}
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # On a PR update, compare only the new commit range. On PR open or
          # reopen, compare the PR base. Branch events use the prior commit.
          token: ''
          base: ${{ github.event.action == 'synchronize' && github.event.before || github.event.pull_request.base.sha || github.ref }}
          filters: |
            frontend:
              - 'apps/web/**'
              - 'shared/brand/**'
              - 'tools/validate-standalone-web.sh'
              - 'bun.lock'
              - 'package.json'
            docs:
              - 'apps/docs/**'
              - 'apps/web/components.json'
              - 'apps/site/**'
              - 'shared/brand/**'
              - 'shared/media/product/**'
              - 'tools/sync-install-scripts.sh'
              - 'bun.lock'
              - 'package.json'
              - '.oxfmtrc.json'
            rust:
              - 'crates/**'
              - 'apps/docs/public/openapi.json'
              - 'Cargo.toml'
              - 'Cargo.lock'

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.frontend == 'true'
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || vars.RUNNER_LINUX || 'oore-linux' }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: make format-check

      - name: Lint
        run: make lint-web

      - name: Build and validate standalone server
        run: make validate-web-launcher

  docs:
    name: Docs
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.docs == 'true'
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || vars.RUNNER_LINUX || 'oore-linux' }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        if: needs.changes.outputs.frontend != 'true'
        run: make format-check

      - name: Lint
        run: make lint-docs

      - name: Type check
        run: make check-docs-types

      - name: Build static output
        run: make build-docs build-site

  rust:
    name: Rust
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.rust == 'true'
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'macos-latest' || vars.RUNNER_MACOS || 'oore-mac' }}
    steps:
      - uses: actions/checkout@v6

      # Self-hosted hosts have no preinstalled toolchain guarantee.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          cache-on-failure: true

      - name: Format check
        run: make format-rust-check

      - name: Clippy
        run: make lint-rust-full

      - name: Check generated OpenAPI
        run: make check-openapi

  required:
    name: Required validation
    if: ${{ always() && !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    needs: [changes, frontend, docs, rust]
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || vars.RUNNER_LINUX || 'oore-linux' }}
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      FRONTEND_RESULT: ${{ needs.frontend.result }}
      DOCS_RESULT: ${{ needs.docs.result }}
      RUST_RESULT: ${{ needs.rust.result }}
    steps:
      - name: Evaluate path-aware validation
        run: |
          test "$CHANGES_RESULT" = success
          case "$FRONTEND_RESULT" in success|skipped) ;; *) exit 1 ;; esac
          case "$DOCS_RESULT" in success|skipped) ;; *) exit 1 ;; esac
          case "$RUST_RESULT" in success|skipped) ;; *) exit 1 ;; esac
