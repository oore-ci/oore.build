name: Autotag

on:
  push:
    branches: [stable, alpha, beta]

concurrency:
  group: autotag-${{ github.ref }}
  queue: max

permissions:
  actions: write
  contents: write

jobs:
  autotag:
    name: Cut release tag
    # Git and gh only. A fresh hosted runner keeps the checkout token off any
    # persistent machine.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Branch protection requires validation before a release branch moves,
    # so this does not wait for the Validate workflow.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Autotag
        id: autotag
        env:
          AUTOTAG_CHANNEL: ${{ github.ref_name }}
          AUTOTAG_BRANCH: ${{ github.ref_name }}
          AUTOTAG_SHA: ${{ github.sha }}
        run: bash tools/autotag.sh

      - name: Start release
        if: steps.autotag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.autotag.outputs.tag }}
        # The protected master branch defines the release and signing boundary.
        run: gh workflow run release.yml --ref master --field tag="${TAG}"
