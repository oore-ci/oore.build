name: Autotag

on:
  push:
    branches: [stable, alpha, beta]

concurrency:
  group: autotag-${{ github.ref }}
  queue: max

permissions:
  actions: write
  contents: write

jobs:
  autotag:
    name: Cut release tag
    runs-on: ${{ vars.RUNNER_MACOS || 'macos-latest' }}
    timeout-minutes: 15
    # Only run after validate completes — but since validate is a separate workflow,
    # we rely on branch protection rules to enforce this ordering.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Autotag
        id: autotag
        env:
          AUTOTAG_CHANNEL: ${{ github.ref_name }}
          AUTOTAG_BRANCH: ${{ github.ref_name }}
          AUTOTAG_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash tools/autotag.sh

      - name: Start release
        if: steps.autotag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.autotag.outputs.tag }}
        # The protected master branch defines the release and signing boundary.
        run: gh workflow run release.yml --ref master --field tag="${TAG}"
